name: sync-decisions
# Copies Tam's answers from the ntfy inbox (kept ~12h) into the permanent archive
# gh-pages:/<board>/decisions.json (+ .csv). Runs every 15 min; also runnable by hand.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-decisions
  cancel-in-progress: false
env:
  BOARD: LIuwAolSQGzafNpe
  TOPIC: sat-mdyykx74QoleiEcgqhMwBUjT
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Merge new answers
        run: python3 tools/sync_decisions.py --file "site/$BOARD/decisions.json" --topic "$TOPIC" --no-remote --quiet
      - name: Commit if anything changed
        working-directory: site
        run: |
          git config user.name "decision-sync"
          git config user.email "decision-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no new answers"; exit 0; fi
          git commit -m "Sync decisions $(date -u +%FT%TZ)"
          git push
