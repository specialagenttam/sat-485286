name: gbp-decode-oneoff
# One-off: decode gbp-src/*.b64 into gh-pages:/gbp/*.jpg. Delete after use.
on:
  push:
    branches: [main]
    paths: ["gbp-src/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-decisions
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Decode into gh-pages/gbp only
        run: |
          mkdir -p site/gbp
          base64 -d src/gbp-src/gbp-lesser.jpg.b64 > site/gbp/gbp-lesser.jpg
          base64 -d src/gbp-src/gbp-loder.jpg.b64 > site/gbp/gbp-loder.jpg
          sha256sum site/gbp/*.jpg
      - name: Commit gbp/ only
        working-directory: site
        run: |
          git config user.name "gbp-decode"
          git config user.email "gbp-decode@users.noreply.github.com"
          git add gbp/gbp-lesser.jpg gbp/gbp-loder.jpg
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Add GBP stills"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
