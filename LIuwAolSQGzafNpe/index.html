<title>Tam's Post Approval Board</title>
<style>
:root{--onyx:#111111;--ink:#1c1c1c;--muted:#6b6b6b;--line:#e2e2e2;--bg:#ececec;--white:#fff;
--brass:#B8935A;--brass-d:#8a6a3a;--rose:#B76E79;--rose-l:#f4e6e4;--pink:#FF2E93;--chart:#D4FF00;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--onyx);color:#fff;padding:12px 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.brand img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--brass)}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:#cfc3b0;font-size:12px;font-weight:400}
.pending-pill{background:var(--pink);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.sync{font-size:11px;color:#bdb3a3;white-space:nowrap}
.filters{max-width:1400px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;max-width:100%}
.fgroup::-webkit-scrollbar{display:none}
.chip{border:1px solid #444;background:transparent;color:#eee;border-radius:999px;padding:6px 11px;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:#fff;color:var(--onyx);border-color:#fff;font-weight:600}
.chip .n{opacity:.65;font-size:11px}
.sep{width:1px;height:22px;background:#444;margin:0 4px}
main{max-width:1400px;margin:0 auto;padding:16px}
.intro{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--muted);font-size:13px;border-left:4px solid var(--brass)}
.intro b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr}main{padding:10px}.top{position:static;padding:10px 12px 8px}.sep{display:none}.brand small{font-size:11px}.filters{gap:6px}}
.card{background:#fff;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.chead{padding:12px 14px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.status{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink);font-size:13px;margin-bottom:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(17,17,17,.18)}
.dot.pending{background:var(--pink)}.dot.approved{background:var(--chart)}.dot.changes{background:var(--brass)}
.chead .row{display:flex;gap:6px;align-items:center;line-height:1.5}
.chead .row b{color:var(--ink);font-weight:600}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink)}
.plat{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
.plat svg{width:15px;height:15px}
.kwchip{display:inline-block;background:var(--chart);color:var(--onyx);font-weight:800;border-radius:4px;padding:1px 6px;font-size:11.5px;letter-spacing:.3px}
.flag{display:block;margin-top:7px;background:var(--rose-l);color:#6d2f39;border:1px solid #e3c3c0;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600}
.note-flag{display:block;margin-top:7px;background:#f6f0e6;color:#5c4524;border:1px solid #e6d6bb;border-radius:6px;padding:6px 8px;font-size:12px}
.pv{margin:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pvh{display:flex;align-items:center;gap:9px;padding:10px 11px}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:#fff;border:1.5px solid #fff;box-shadow:0 0 0 1px #d9d9d9}
.nm{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.2}
.sub{font-size:11.5px;color:var(--muted)}
.more{margin-left:auto;color:#999;font-weight:700;letter-spacing:1px}
.cap{padding:8px 11px 10px;font-size:13.5px;white-space:normal;word-wrap:break-word}
.cap .txt{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.cap.open .txt{display:block}
.seemore{background:none;border:0;padding:0;color:var(--muted);font-weight:600;font-size:13px;margin-top:2px}
.seemore[hidden]{display:none}
mark.kw{background:var(--chart);color:var(--onyx);font-weight:800;padding:0 3px;border-radius:3px}
.tag{color:var(--brass-d)}
.lnk{color:var(--brass-d);text-decoration:underline;word-break:break-all}
.need{background:var(--rose-l);color:#6d2f39;border:1px dashed var(--rose);border-radius:4px;padding:0 4px;font-weight:600;font-size:12.5px}
.media{position:relative;background:#f3f3f3;overflow:hidden}
.media img.main{width:100%;height:100%;object-fit:cover;display:block}
.r45{aspect-ratio:4/5}.r916{aspect-ratio:9/16}.r43{aspect-ratio:4/3}.r11{aspect-ratio:1/1}
.play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.play:after{content:"";border-left:17px solid var(--onyx);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.mlabel{position:absolute;left:8px;bottom:8px;background:rgba(17,17,17,.75);color:#fff;font-size:10.5px;padding:3px 7px;border-radius:4px;max-width:85%}
.badge{position:absolute;right:8px;top:8px;background:rgba(17,17,17,.75);color:#fff;font-size:11px;padding:3px 7px;border-radius:4px;font-weight:600}
.ph{background:repeating-linear-gradient(135deg,#f7f5f1 0 14px,#f0ece5 14px 28px);display:flex;flex-direction:column;padding:14px;border-top:1px dashed var(--brass);border-bottom:1px dashed var(--brass);min-height:0}
.ph .k{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--brass-d);display:flex;align-items:center;gap:6px}
.ph .k:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pink)}
.ph .lbl{font-weight:700;font-size:13px;margin:6px 0 6px;color:var(--ink)}
.ph ul{margin:0;padding-left:17px;font-size:12px;color:#444}
.ph li{margin:2px 0}
.ph .onhand{margin-top:auto;padding-top:10px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.ph .onhand img{width:44px;height:58px;object-fit:cover;border-radius:4px;border:1px solid #ddd;flex:none}
.tt .media{background:var(--onyx)}
.tt .mlabel{top:8px;bottom:auto}
.tt .ph{background:repeating-linear-gradient(135deg,#1a1a1a 0 14px,#151515 14px 28px);border-color:#5b4a2f}
.tt .ph .lbl{color:#fff}.tt .ph ul{color:#ddd}.tt .ph .onhand{color:#bbb}
.ttover{position:absolute;left:0;right:0;bottom:0;padding:40px 54px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.ttover .nm{color:#fff}
.ttover .cap{padding:4px 0 0;color:#fff;font-size:13px}
.ttover .seemore{color:#ddd}
.ttover .tag{color:#f0d9b5}.ttover .lnk{color:#f0d9b5}
.rail{position:absolute;right:8px;bottom:70px;display:flex;flex-direction:column;gap:14px;align-items:center;color:#fff;font-size:10px}
.rail span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:14px}
.tt.ph-mode .ttover{position:static;background:var(--onyx);padding:10px 12px}
.tt.ph-mode .rail{display:none}
.igact{display:flex;gap:14px;padding:9px 11px 0;font-size:19px;color:var(--ink)}
.igact .sv{margin-left:auto}
.ctabar{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#f6f4f0;border-top:1px solid var(--line)}

.fbreact{display:flex;justify-content:space-around;padding:8px 6px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600}

.gbpbtn{margin:0 11px 12px;display:block;text-align:center;border:1px solid var(--onyx);color:var(--onyx);border-radius:999px;padding:8px;font-weight:700;font-size:13px}

.actions{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{width:100%;border-radius:8px;padding:13px 12px;font-weight:700;font-size:15px;border:0;min-height:48px}
.btn.ok{background:var(--onyx);color:#fff}
.btn.ok:active{background:#000}
.btn.chg{background:#fff;color:var(--onyx);border:1.5px solid var(--brass)}
.btn[disabled]{opacity:.55}
.chgbox{display:none;flex-direction:column;gap:8px}
.chgbox.open{display:flex}
.chgbox textarea{width:100%;min-height:96px;border:1.5px solid var(--brass);border-radius:8px;padding:10px;font:inherit;font-size:16px;resize:vertical}
.btn.sub{background:var(--pink);color:#fff}
.hist{border-top:1px solid var(--line);padding:10px 14px 12px;font-size:12px;color:var(--muted);background:#fafafa}
.hist h4{margin:0 0 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hi{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.hi .dot{margin-top:3px;flex:none}
.hi b{color:var(--ink)}
.hi q{display:block;color:#333;quotes:none;white-space:pre-wrap;margin-top:2px}
.hi .st{font-size:10.5px;color:#999}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--onyx);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#6d2f39}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
footer{max-width:1400px;margin:0 auto;padding:6px 16px 40px;color:#999;font-size:11px}
</style>
</head>

const load = k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return []}};
const save = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

// ---------- cards ----------
const cards=[];
DATA.posts.forEach(p=>ORDER.forEach(pl=>{ if(!p.platforms[pl]) return;
  const t=(p.times&&p.times[pl])||C.default_times[pl]||"12:00";
  cards.push({key:p.id+"|"+pl, post:p, pl, d:p.platforms[pl], time:t, sort:p.date+"T"+t});
}));
cards.sort((a,b)=>a.sort<b.sort?-1:a.sort>b.sort?1:0);
const dates=DATA.posts.map(p=>p.date).sort();
const fmtDay = iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})};
const fmtTime = hm=>{let [h,m]=hm.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap};
const fmtStamp = ts=>new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:TZ})+" PT";
$("#weeklbl").textContent = dates.length? ("Posts for "+fmtDay(dates[0])+" – "+fmtDay(dates[dates.length-1])+" · Special Agent Tam") : "";
$("#brandav").src = IM(DATA.avatar);

// ---------- caption rendering ----------
function kwList(p){return (p.keyword||"").split(/[\/,]/).map(s=>s.trim()).filter(Boolean)}
function renderCaption(text,p){
  let h=esc(text);
  h=h.replace(/\[([^\]]*(NEEDS|TBD)[^\]]*)\]/g,'<span class="need">⚑ $1</span>');
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<span class="lnk">$1</span>');
  h=h.replace(/(^|\s)(#[A-Za-z]\w*)/g,'$1<span class="tag">$2</span>');
  const kws=kwList(p);
  if(kws.length){
    const alt=kws.map(k=>k.replace(/[^A-Z0-9]/gi,"")).join("|");
    h=h.replace(new RegExp("(Comment\\s+)("+alt+")\\b","g"),'<mark class="kw">$1$2</mark>');
    h=h.replace(new RegExp("(or\\s+)("+alt+")(\\s+for)","g"),'$1<mark class="kw">$2</mark>$3');
  }
  return h.replace(/\n/g,"<br>");
}
function capBlock(text,p,lines,label,prefix){
  return '<div class="cap" data-lines="'+lines+'"><div class="txt" style="-webkit-line-clamp:'+lines+'">'+(prefix||"")+renderCaption(text,p)+
    '</div><button class="seemore" type="button" hidden>'+label+'</button></div>';
}

// ---------- media ----------
function mediaFor(c){const m=c.post.media||{kind:"placeholder"};return (m.per_platform&&m.per_platform[c.pl])||m}
function mediaBlock(c,ratio){
  const m=mediaFor(c), p=c.post;
  if(m.img){
    return '<div class="media '+ratio+'"><img class="main" src="'+IM(m.img)+'" alt="Frame from '+esc(m.label||"")+'">'+
      (m.kind==="video"?'<div class="play" aria-hidden="true"></div>':'')+
      (m.label?'<div class="mlabel">'+esc(m.label)+'</div>':'')+'</div>';
  }
  const shots=(p.shot_list||[]).map(s=>s.replace(/\s+/g," ").trim());
  const maxN = ratio==="r43"?3:5;
  const lis=shots.slice(0,maxN).map(s=>'<li>'+esc(s.length>95?s.slice(0,92)+"…":s)+'</li>').join("")+
    (shots.length>maxN?'<li>+'+(shots.length-maxN)+' more in the shot list</li>':'');
  const oh=(m.on_hand||[]).map(o=>'<div class="onhand"><img src="'+IM(o.img)+'" alt=""><span>'+esc(o.label)+'</span></div>').join("");
  return '<div class="media ph '+ratio+'">'+(m.slides?'<div class="badge">'+m.slides+' slides</div>':'')+
    '<div class="k">Footage to shoot</div><div class="lbl">'+esc(m.label||"No media yet")+'</div>'+
    (lis?'<ul>'+lis+'</ul>':'')+oh+'</div>';
}

// ---------- platform previews ----------
const AV=()=>'<img class="av" src="'+IM(DATA.avatar)+'" alt="">';
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
function preview(c){
  const d=c.d,p=c.post;
  if(c.pl==="ig") return '<div class="pv">'+
    '<div class="pvh">'+AV()+'<div><div class="nm">Special Agent Tam</div><div class="sub">'+esc(p.place||"")+'</div></div><span class="more">···</span></div>'+
    mediaBlock(c,"r45")+'<div class="igact"><span>♡</span><span>💬</span><span>➤</span><span class="sv">🔖</span></div>'+
    capBlock(d.caption,p,2,"more",'<b>Special Agent Tam</b> ')+'</div>';
  if(c.pl==="tiktok"){
    const m=mediaFor(c), ph=!m.img;
    return '<div class="pv tt'+(ph?' ph-mode':'')+'"><div style="position:relative">'+mediaBlock(c,"r916")+
      (ph?'':'<div class="rail"><span>♥</span><span>💬</span><span>🔖</span><span>↗</span></div>')+
      (ph?'</div>':'')+
      '<div class="ttover"><div class="pvh" style="padding:0 0 4px">'+AV()+'<div class="nm">Special Agent Tam</div></div>'+capBlock(d.caption,p,2,"more")+'</div>'+
      (ph?'':'</div>')+'</div>';
  }
  if(c.pl==="fb"){
    const link=d.link? '<div class="ctabar"><div class="u">'+esc(host(d.link).toUpperCase())+'<b>'+esc(p.place||"See the listing")+'</b></div><span class="ctabtn">Learn more</span></div>' : '';
    return '<div class="pv"><div class="pvh">'+AV()+'<div><div class="nm">Special Agent Tam</div><div class="sub">'+esc(fmtDay(p.date))+' · 🌐</div></div><span class="more">···</span></div>'+
      capBlock(d.caption,p,3,"See more")+mediaBlock(c,"r45")+link+'<div class="fbreact"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div></div>';
  }
  if(c.pl==="linkedin"){
    const fc=d.first_comment? '<div class="licomment"><b>First comment (Tam)</b>'+renderCaption(d.first_comment,p)+'</div>':'';
    return '<div class="pv"><div class="pvh">'+AV()+'<div><div class="nm">Special Agent Tam</div><div class="sub">Oregon Licensed Real Estate Broker | eXp Realty</div></div></div>'+
      capBlock(d.caption,p,3,"…more")+mediaBlock(c,"r45")+'<div class="fbreact"><span>👍 Like</span><span>💬 Comment</span><span>↻ Repost</span></div>'+fc+'</div>';
  }
  if(c.pl==="gbp"){
    const b=d.button||{label:"Learn more",url:""}; const tbd=!/^https?:\/\//.test(b.url||"");
    return '<div class="pv"><div class="pvh">'+AV()+'<div><div class="nm">Special Agent Tam</div><div class="sub">Real estate agent · Google update</div></div></div>'+
      mediaBlock(c,"r43")+capBlock(d.caption,p,4,"More")+
      '<span class="gbpbtn'+(tbd?' tbd':'')+'">'+esc(b.label)+(tbd?' (link TBD)':'')+'</span>'+
      '<div class="gbpurl">'+(tbd?esc(b.url||"No link yet"):'→ '+esc(b.url))+'</div></div>';
  }
  return "";
}

// ---------- decisions ----------
let decisions=[]; // {uid, post_id, platform, decision, note, at, src}
function merge(list,src){
  const seen=new Map(decisions.map(d=>[d.uid,d]));
  list.forEach(r=>{ if(!r||!r.uid||!r.post_id||!r.platform||!STAT[r.decision]) return;
    const prev=seen.get(r.uid); if(prev){ if(src!=="local") prev.src=src; return; }
    const d={uid:r.uid,post_id:r.post_id,platform:r.platform,decision:r.decision,note:String(r.note||"").slice(0,4000),at:r.at||new Date().toISOString(),src};
    decisions.push(d); seen.set(d.uid,d);
  });
  decisions.sort((a,b)=>a.at<b.at?-1:1);
}
const latest = key=>{let L=null;decisions.forEach(d=>{if(d.post_id+"|"+d.platform===key)L=d});return L};
const statusOf = key=>{const L=latest(key);return L?L.decision:"pending"};

merge(DATA.decisions||[],"synced");
merge(load(LS_LOCAL),"local");
merge(load(LS_OUT),"queued");

async function publish(rec){
  const body={topic:C.ntfy_topic,
    title:(rec.decision==="approved"?"Approved: ":"Changes: ")+rec.post_id+" "+(PLATS[rec.platform]||{}).short,
    message:JSON.stringify(rec), tags:[rec.decision==="approved"?"white_check_mark":"pencil2"]};
  const r=await fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify(body),cache:"no-store",referrerPolicy:"no-referrer"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function flushOutbox(){
  let out=load(LS_OUT); if(!out.length) return;
  const keep=[];
  for(const rec of out){ try{ await publish(rec); const l=load(LS_LOCAL); l.push(rec); save(LS_LOCAL,l.slice(-300)); const d=decisions.find(x=>x.uid===rec.uid); if(d) d.src="sent"; }catch(e){ keep.push(rec); } }
  save(LS_OUT,keep); render(); if(!keep.length && out.length) toast("Saved answers that were waiting to send ✓");
}
async function decide(c,decision,note){
  const rec={v:1,uid:uid(),post_id:c.post.id,platform:c.pl,decision,note:note||"",at:new Date().toISOString(),device};
  merge([rec],"queued"); render();
  try{ await publish(rec); const l=load(LS_LOCAL); l.push(rec); save(LS_LOCAL,l.slice(-300)); decisions.find(x=>x.uid===rec.uid).src="sent";
    toast(decision==="approved"?"Approved ✓ Saved for the team":"Change request saved ✓"); }
  catch(e){ const o=load(LS_OUT); o.push(rec); save(LS_OUT,o); toast("No connection. Your answer is saved on this phone and will send automatically.",true); }
  render();
}

// ---------- filters + render ----------
const F={plat:"all",stat:"all"};
function chips(){
  const counts={all:cards.length}; ORDER.forEach(k=>counts[k]=cards.filter(c=>c.pl===k).length);
  $("#fplat").innerHTML=[["all","All platforms"]].concat(ORDER.filter(k=>counts[k]).map(k=>[k,PLATS[k].short])).map(([k,l])=>
    '<button class="chip" data-f="plat" data-v="'+k+'" aria-pressed="'+(F.plat===k)+'">'+(k!=="all"?PLATS[k].svg.replace("<svg",'<svg width="13" height="13"'):"")+esc(l)+' <span class="n">'+counts[k]+'</span></button>').join("");
  const sc={all:0,pending:0,approved:0,changes:0};
  cards.filter(c=>F.plat==="all"||c.pl===F.plat).forEach(c=>{sc.all++;sc[statusOf(c.key)]++});
  $("#fstat").innerHTML=[["all","All statuses"],["pending","Pending"],["approved","Approved"],["changes","Changes requested"]].map(([k,l])=>
    '<button class="chip" data-f="stat" data-v="'+k+'" aria-pressed="'+(F.stat===k)+'">'+(k!=="all"?'<span class="dot '+k+'"></span>':"")+esc(l)+' <span class="n">'+sc[k]+'</span></button>').join("");
  const pend=cards.filter(c=>statusOf(c.key)==="pending").length;
  $("#pendcount").textContent=pend+" pending";
}
document.addEventListener("click",e=>{
  const ch=e.target.closest(".chip"); if(ch){F[ch.dataset.f]=ch.dataset.v; render(); return;}
  const sm=e.target.closest(".seemore"); if(sm){const cap=sm.parentElement; cap.classList.toggle("open"); sm.textContent=cap.classList.contains("open")?"less":(sm.dataset.l||"more"); return;}
  const b=e.target.closest("[data-act]"); if(!b) return;
  const card=b.closest(".card"), c=cards.find(x=>x.key===card.dataset.key);
  if(b.dataset.act==="ok"){ b.disabled=true; decide(c,"approved",""); }
  if(b.dataset.act==="chg"){ const box=card.querySelector(".chgbox"); box.classList.toggle("open"); if(box.classList.contains("open")) box.querySelector("textarea").focus(); }
  if(b.dataset.act==="sub"){ const ta=card.querySelector("textarea"); const v=ta.value.trim();
    if(!v){ ta.focus(); toast("Type what you'd like changed first",true); return; }
    drafts.delete(c.key); decide(c,"changes",v); }
});
const drafts=new Map();
document.addEventListener("input",e=>{ if(e.target.matches(".chgbox textarea")) drafts.set(e.target.closest(".card").dataset.key,e.target.value); });

function cardHTML(c){
  const p=c.post, st=statusOf(c.key), hist=decisions.filter(d=>d.post_id+"|"+d.platform===c.key).slice().reverse();
  const flags=(p.flags||[]).map(f=>'<span class="flag">⚑ '+esc(f)+'</span>').join("");
  const notes=(p.notes||[]).filter(n=>!/^Do not post until/.test(n)||!(p.flags||[]).length).map(n=>'<span class="note-flag">'+esc(n)+'</span>').join("")+
    ((p.flags||[]).length?'<span class="note-flag">'+esc((p.notes||[]).find(n=>/^Do not post until/.test(n))||"")+'</span>':'');
  const kw = c.pl==="gbp" ? '<span class="sub">No keyword on GBP (button instead)</span>' : (p.keyword?'Keyword <span class="kwchip">'+esc(p.keyword)+'</span>':'');
  const open=drafts.has(c.key);
  return '<article class="card" data-key="'+esc(c.key)+'">'+
   '<div class="chead"><div class="status"><span class="dot '+st+'"></span>'+STAT[st]+'</div>'+
   '<div class="row">ID: <span class="pid">'+esc(p.id)+' · '+PLATS[c.pl].short+'</span></div>'+
   '<div class="row"><b>'+esc(p.title)+'</b></div>'+
   '<div class="row">Planned: '+esc(fmtDay(p.date))+' · '+fmtTime(c.time)+' PT</div>'+
   '<div class="row"><span class="plat">'+PLATS[c.pl].svg+PLATS[c.pl].name+'</span> · '+esc(p.format)+'</div>'+
   '<div class="row">'+kw+'</div>'+flags+notes+'</div>'+
   preview(c)+
   '<div class="actions"><button class="btn ok" type="button" data-act="ok">Approve</button>'+
   '<button class="btn chg" type="button" data-act="chg">Explain what I want changed</button>'+
   '<div class="chgbox'+(open?' open':'')+'"><textarea placeholder="What should change? (caption, video, timing…)" aria-label="What should change">'+esc(drafts.get(c.key)||"")+'</textarea>'+
   '<button class="btn sub" type="button" data-act="sub">Submit</button></div></div>'+
   (hist.length?'<div class="hist"><h4>Past decisions</h4>'+hist.map(h=>'<div class="hi"><span class="dot '+h.decision+'"></span><div><b>'+STAT[h.decision]+'</b> · '+fmtStamp(h.at)+
     (h.src==="queued"?' <span class="st">(waiting to send)</span>':'')+(h.note?'<q>'+esc(h.note)+'</q>':'')+'</div></div>').join("")+'</div>':'')+
   '</article>';
}
function render(){
  chips();
  const list=cards.filter(c=>(F.plat==="all"||c.pl===F.plat)&&(F.stat==="all"||statusOf(c.key)===F.stat));
  $("#grid").innerHTML=list.length?list.map(cardHTML).join(""):'<div class="empty">Nothing here with these filters.</div>';
  document.querySelectorAll(".cap").forEach(cap=>{const t=cap.querySelector(".txt"),b=cap.querySelector(".seemore");
    b.dataset.l=b.textContent; if(t.scrollHeight>t.clientHeight+2) b.hidden=false;});
}
let tt; function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast show"+(err?" err":"");clearTimeout(tt);tt=setTimeout(()=>t.className="toast",3200)}

// ---------- remote sync (read) ----------
async function pull(){
  const got=[];
  try{ const r=await fetch("https://raw.githubusercontent.com/"+C.repo+"/"+C.branch+"/"+C.board_path+"/decisions.json?t="+Date.now(),{cache:"no-store",referrerPolicy:"no-referrer"});
    if(r.ok){ const j=await r.json(); merge(j.decisions||[],"synced"); got.push("archive"); } }catch(e){}
  try{ const r=await fetch("https://ntfy.sh/"+C.ntfy_topic+"/json?poll=1&since=all",{cache:"no-store",referrerPolicy:"no-referrer"});
    if(r.ok){ const t=await r.text(); const recs=t.split("\n").filter(Boolean).map(l=>{try{const e=JSON.parse(l); if(e.event!=="message")return null; return JSON.parse(e.message)}catch(x){return null}}).filter(Boolean);
      merge(recs,"synced"); got.push("live"); } }catch(e){}
  $("#sync").textContent = got.length? ("Synced "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TZ})+" PT") : "Offline: showing saved answers";
  render();
}
$("#foot").textContent="Built "+fmtStamp(DATA.built)+" · "+cards.length+" cards · private link, please don't share";
render(); pull().then(flushOutbox);
setInterval(()=>{pull().then(flushOutbox)},60000);
window.addEventListener("online",flushOutbox);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) pull().then(flushOutbox)});
})();
</script>
